plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.chordlab'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.chordlab"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            // Exclude or pickFirst the duplicate native-image files from MongoDB
            pickFirst 'META-INF/native-image/org.mongodb/bson/native-image.properties'
        }
        // Fixes the OpenCV & FFmpeg duplicate C++ library crash
        jniLibs {
            pickFirsts += [
                    'lib/arm64-v8a/libc++_shared.so',
                    'lib/armeabi-v7a/libc++_shared.so',
                    'lib/x86/libc++_shared.so',
                    'lib/x86_64/libc++_shared.so'
            ]
        }
    }

    androidResources {
        noCompress 'task', 'tflite'
    }
}

dependencies {
    // Core Dependencies
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.1.1')
    implementation 'com.google.firebase:firebase-database'
    implementation libs.firebase.auth

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // AI ENGINE
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // TENSORFLOW LITE
    implementation('org.tensorflow:tensorflow-lite') {
        version { strictly '2.16.1' }
    }
    implementation('org.tensorflow:tensorflow-lite-api') {
        version { strictly '2.16.1' }
    }
    implementation('org.tensorflow:tensorflow-lite-select-tf-ops') {
        version { strictly '2.16.1' }
    }

    // SAFE AUDIO ADDITION
    implementation('org.tensorflow:tensorflow-lite-task-audio:0.4.4') {
        exclude group: 'org.tensorflow', module: 'tensorflow-lite'
    }

    // Media & Audio Utilities
    implementation 'com.github.st-h:TarsosDSP:2.4.1'
    implementation 'io.github.maxrave-dev:ffmpeg-kit-audio:6.0.1'
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // OpenCV Local Module
    implementation(project(":opencv"))
}